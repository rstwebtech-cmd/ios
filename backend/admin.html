<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Janhavi Admin</title>
<style>
:root{--bg:#fff;--sb:#f8f8f6;--cd:#fff;--bd:#e7e7e4;--tx:#111;--mu:#777;--ac:#f04e12}
[data-t=dark]{--bg:#0f1115;--sb:#15181e;--cd:#1a1d24;--bd:#2a2e37;--tx:#f2f2f2;--mu:#9aa0aa}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s}
#ap{display:flex;min-height:100vh}aside{width:250px;flex:none;background:var(--sb);border-right:1px solid var(--bd);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;transition:left .3s}
main{flex:1;min-width:0}header{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
#mn{padding:22px;animation:fu .5s}.sp{flex:1}.mu{color:var(--mu)}
aside a{display:flex;gap:10px;padding:10px 12px;margin:3px 0;border-radius:10px;cursor:pointer;transition:.2s}aside a:hover{background:var(--bd);transform:translateX(4px)}aside a.on{background:var(--bd);font-weight:600}aside a i{font-style:normal}
aside small{display:block;margin:16px 8px 4px;color:var(--mu);font-size:11px;letter-spacing:1px}.lgo{font-size:18px;padding:6px 8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:8px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:8px 0;animation:fu .5s both;transition:.25s;overflow:hidden}.cd:hover{transform:translateY(-3px);box-shadow:0 10px 26px #0001}
.cd b.n{display:block;font-size:30px;margin-top:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes dr{to{stroke-dashoffset:0}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s ease forwards}.fi{animation:fu 1.2s both}.sg{transition:stroke-dasharray 1.1s ease}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:5px 0 12px}.bar i{display:block;height:8px;width:0;background:var(--ac);border-radius:6px;transition:width 1.1s ease}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.tag{font-size:11px;background:var(--bd);padding:2px 8px;border-radius:10px}
input,textarea,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{background:var(--tx);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;margin:3px;transition:.2s}button:hover{transform:translateY(-2px);opacity:.85}
.ic{width:40px;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.tabs{background:var(--bd);border-radius:10px;padding:3px}.tabs button{background:none;color:var(--mu);margin:0}.tabs button.on{background:var(--cd);color:var(--tx)}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}td,th{padding:10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
pre{background:var(--bd);padding:12px;border-radius:10px;overflow:auto;font-size:12px}
#lg{max-width:360px;margin:15vh auto;text-align:center}#ov{display:none}
@media(max-width:900px){aside{position:fixed;left:-270px;z-index:20;height:100%}aside.o{left:0}#ov.o{display:block;position:fixed;inset:0;background:#0006;z-index:15}.g2{grid-template-columns:1fr}#mn{padding:14px}header{padding:10px 14px}}
</style>
<div id=lg class=cd><h2>👑 Janhavi Panwar</h2><small class=mu>Admin panel v9 (fixed)</small><input id=k type=password placeholder="Admin Key"><button onclick=ent()>Login</button></div>
<div id=ap hidden><div id=ov onclick=tg()></div><aside id=sb></aside><main><header><button class=ic onclick=tg()>☰</button><b id=tt>Dashboard</b><span class=sp></span><button class=ic onclick=th()>🌓</button></header><div id=mn></div></main></div>
<script>
let K='',C=[],U={},D={};const $=i=>document.getElementById(i),R=n=>'₹'+(+n||0).toLocaleString('en-IN');
const NAV=[['OVERVIEW',[['dash','Dashboard','▦'],['ord','Orders','🛒'],['stu','Students / Send','👥'],['ref','Referrals','🎁']]],['CONTENT',[['crs','Courses & Classes','📚'],['cmb','Combos','🧩'],['cpn','Coupons','🏷️'],['liv','Live Classes','🎥']]],['ENGAGE',[['com','Community','💬'],['sup','Support Chat','🛟'],['faq','Auto-reply Q&A','🤖'],['pst','Community Posts','📝'],['rev','Reviews','⭐']]],['SYSTEM',[['int','Website Connect','🔗'],['bak','Backup / Import','💾'],['set','Settings','⚙️']]]];
async function A(m,p,b){const r=await fetch(p,{method:m,headers:{'X-Admin-Key':K,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}
async function ent(){K=$('k').value;const r=await A('GET','/api/admin/stats');if(r.error)return alert('Wrong key');$('lg').hidden=true;$('ap').hidden=false;go('dash')}
function tg(){$('sb').classList.toggle('o');$('ov').classList.toggle('o')}
function th(){const d=document.documentElement;d.dataset.t=d.dataset.t=='dark'?'':'dark'}
function go(n){$('sb').classList.remove('o');$('ov').classList.remove('o');$('sb').innerHTML='<div class=lgo>👑 <b>Janhavi</b></div>'+NAV.map(g=>`<small>${g[0]}</small>`+g[1].map(x=>`<a class="${x[0]==n?'on':''}" onclick="go('${x[0]}')"><i>${x[2]}</i>${x[1]}</a>`).join('')).join('');$('tt').textContent=(NAV.flatMap(g=>g[1]).find(x=>x[0]==n)||[])[1];window[n]()}
function spark(V,c){if(!V||V.length<2)return '';const W=200,H=44,m=Math.max(...V,1),P=V.map((v,i)=>[i*W/(V.length-1),H-v/m*(H-6)-3]),d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:44px;margin-top:8px"><path d="${d}L${W} ${H}L0 ${H}Z" fill="${c}" opacity=".12" class=fi /><path class=dr pathLength=1 d="${d}" fill=none stroke="${c}" stroke-width=2.5 /></svg>`}
function stc(t,v,r,V,c){return `<div class=cd><small class=mu>${t}</small><b class=n data-n=${v} data-r=${r}>0</b>${spark(V,c)}</div>`}
function area(L,V){const W=640,H=220,m=Math.max(...V,1),n=V.length,P=V.map((v,i)=>[i*W/(n-1),H-v/m*H*.85-5]),d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');return `<svg viewBox="0 0 ${W} ${H+24}" style="width:100%"><defs><linearGradient id=gr x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#f04e12" stop-opacity=.35 /><stop offset=1 stop-color="#f04e12" stop-opacity=0 /></linearGradient></defs><path class=fi d="${d}L${W} ${H}L0 ${H}Z" fill="url(#gr)"/><path class=dr pathLength=1 d="${d}" fill=none stroke="#f04e12" stroke-width=3 />${P.map((p,i)=>i%3==0?`<text x=${p[0]} y=${H+18} font-size=11 fill="#999" text-anchor=middle>${L[i]}</text>`:'').join('')}</svg>`}
function donut(o){const e=Object.entries(o||{}),t=e.reduce((x,y)=>x+y[1],0)||1,cl=['#f04e12','#0d9488','#1e3a5f','#f59e0b','#8b5cf6'],C0=251.2;let off=0;const sg=e.map((x,i)=>{const l=x[1]/t*C0,s=`<circle class=sg cx=60 cy=60 r=40 fill=none stroke="${cl[i%5]}" stroke-width=16 stroke-dasharray="0 ${C0}" data-d="${l} ${C0-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join('');return `<div class=row><svg viewBox="0 0 120 120" width=130>${sg}<text x=60 y=65 text-anchor=middle font-weight=700 fill=currentColor>${e.length?t:0}</text></svg><div>${e.map((x,i)=>`<div><span class=dot style="background:${cl[i%5]}"></span>${x[0]} <b>${Math.round(x[1]/t*100)}%</b></div>`).join('')||'<small class=mu>Abhi sale nahi</small>'}</div></div>`}
function bars(t,v,g){const p=Math.min(100,Math.round(v/Math.max(g,1)*100));return `<div class=row><span>${t}</span><small class=mu>${p}%</small></div><div class=bar><i data-w=${p}></i></div>`}
function anim(){document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,r=+e.dataset.r,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),v=Math.round(to*(1-Math.pow(1-k,3)));e.textContent=r?R(v):v;if(k<1)requestAnimationFrame(f)})(t0)});document.querySelectorAll('.sg').forEach(e=>e.style.strokeDasharray=e.dataset.d);document.querySelectorAll('.bar i[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')}
async function dash(){const s=D=await A('GET','/api/admin/stats');C=await (await fetch('/api/courses')).json();const mx=Math.max(...(s.top||[]).map(t=>t.Sales),1);
$('mn').innerHTML=`<h2 style="margin:0">Dashboard</h2><p class=mu>Welcome back! Here's what's happening with your business today.</p><div class=g>${stc('Total Revenue',s.revenue,1,s.values,'#f04e12')}${stc('Orders',s.orders,0,s.ovalues,'#0d9488')}${stc('Students',s.customers,0)}${stc('Pending Payments',s.pending,0)}</div>
<div class=g2><div class=cd><div class=row><div><b>Overview</b><br><small class=mu>Last 14 days</small></div><span class=tabs><button id=t0 class=on onclick="ch(0)">Revenue</button><button id=t1 onclick="ch(1)">Orders</button></span></div><div id=chart>${area(s.labels,s.values)}</div></div>
<div><div class=cd><b>Sales by Category</b><br><br>${donut(s.cats)}</div><div class=cd><b>Monthly Goals</b><br><br>${bars('Revenue '+R(s.monthRevenue)+' / '+R(s.targetRevenue),s.monthRevenue,s.targetRevenue)}${bars('Students '+s.customers+' / '+s.targetStudents,s.customers,s.targetStudents)}${bars('Certificates '+s.certs,s.certs,100)}</div></div></div>
<div class=g><div class=cd><b>Top Selling Courses</b><br><br>${(s.top||[]).map(t=>`${t.Title} <small class=mu>${t.Sales} sales</small><div class=bar><i data-w=${t.Sales/mx*100}></i></div>`).join('')||'<small class=mu>Abhi koi sale nahi</small>'}</div><div class=cd><b>Current Offers</b><br><br>${C.map(c=>`${c.Title} <small class=mu>${c.OfferLabel||''} ${R(c.Price)} <s>${R(c.MRP)}</s></small><div class=bar><i data-w=${Math.round((c.MRP-c.Price)/c.MRP*100)}></i></div>`).join('')}</div></div>`;setTimeout(anim,60)}
function ch(i){$('t0').className=i?'':'on';$('t1').className=i?'on':'';$('chart').innerHTML=area(D.labels,i?D.ovalues:D.values)}
async function crs(){C=await A('GET','/api/admin/courses');$('mn').innerHTML='<h2>Courses & Offers</h2><button onclick=addc()>+ New course</button>'+C.map((c,i)=>`<div class=cd><b>${c.Title}</b> <small>${c.ID}</small>`+['Title','Category','Duration','OfferLabel','OfferEnds','Image'].map(f=>`${f}<input value="${(c[f]||'').replace(/"/g,'&quot;')}" oninput="C[${i}].${f}=this.value">`).join('')+`Price <input type=number value=${c.Price} oninput="C[${i}].Price=+this.value">MRP <input type=number value=${c.MRP} oninput="C[${i}].MRP=+this.value">Image upload (700KB tak) <input type=file accept="image/*" onchange="up(${i},this)">Course Classes: ek line = ek class → Class ka naam | YouTube/Vimeo/Drive link | free (demo class ho to)<textarea rows=4 oninput="C[${i}].Lessons=pl(this.value)">${(c.Lessons||[]).map(l=>l.Title+' | '+l.URL+(l.Free?' | free':'')).join('\n')}</textarea>Quiz (ek line: Sawal | op1 | op2 | op3 | sahi option number)<textarea rows=3 id=q${i} placeholder="Capital of France? | Paris | Rome | Berlin | 1"></textarea><button onclick="sc(${i})">Save</button> <button onclick="sq(${i})">Save quiz</button></div>`).join('')}
function pl(t){return t.split('\n').filter(x=>x.trim()).map(x=>{const p=x.split('|').map(s=>s.trim());return{Title:p[0],URL:p[1]||'',Free:(p[2]||'')=='free'}})}
async function up(i,el){const f=new FormData();f.append('file',el.files[0]);const r=await (await fetch('/api/admin/upload',{method:'POST',headers:{'X-Admin-Key':K},body:f})).json();if(r.url){C[i].Image=r.url;await A('POST','/api/admin/courses',C[i]);crs()}else alert(r.error)}
async function sq(i){const qs=$('q'+i).value.split('\n').filter(x=>x.trim()).map(x=>{const p=x.split('|').map(s=>s.trim());return{Q:p[0],Options:p.slice(1,-1),Answer:(+p[p.length-1])-1}});await A('POST','/api/admin/quiz/'+C[i].ID,qs);alert('Quiz saved: '+qs.length+' sawal')}
async function sc(i){await A('POST','/api/admin/courses',C[i]);alert('Saved')}
async function addc(){await A('POST','/api/admin/courses',{Title:'New Course',Category:'English',Duration:'0m',Price:999,MRP:1999});crs()}
async function cpn(){const l=await A('GET','/api/admin/coupons');$('mn').innerHTML='<h2>Coupon Codes</h2><div class=cd><input id=cc placeholder="CODE (jaise DIWALI50)"><input id=cp type=number placeholder="Percent off (jaise 20)"><input id=cf type=number placeholder="ya Flat Rs off"><input id=cm type=number placeholder="Max use (0 = unlimited)"><input id=ce placeholder="Expiry YYYY-MM-DD (khali = kabhi nahi)"><button onclick=addcp()>Add coupon</button></div>'+(l||[]).map(c=>`<div class=cd><b>${c.Code}</b> ${c.Percent?c.Percent+'% off':'Rs '+c.Flat+' off'} | used ${c.Used}/${c.MaxUses||'∞'} | ${c.Expires||'no expiry'} <button onclick="dc('${c.Code}')">Delete</button></div>`).join('')}
async function addcp(){await A('POST','/api/admin/coupons',{Code:$('cc').value.toUpperCase(),Percent:+$('cp').value,Flat:+$('cf').value,MaxUses:+$('cm').value,Expires:$('ce').value,Active:true});cpn()}
async function dc(c){await A('POST','/api/admin/coupons/'+c+'/delete');cpn()}
async function cmb(){C=await A('GET','/api/admin/courses');const l=await (await fetch('/api/combos')).json();$('mn').innerHTML='<h2>Combos</h2><div class=cd><input id=ct placeholder="Combo ka naam"><small>Courses chuno:</small><br>'+C.map(c=>`<label><input type=checkbox style="width:auto" class=cs value="${c.ID}" data-p=${c.Price}> ${c.Title} (₹${c.Price})</label><br>`).join('')+'<input id=cpr type=number placeholder="Combo price"><button onclick=addcm()>Create combo</button></div>'+(l||[]).map(b=>`<div class=cd><b>${b.Title}</b> ₹${b.Price} <s>₹${b.MRP}</s> (${b.Items.length} courses) <button onclick="dcm('${b.ID}')">Delete</button></div>`).join('')}
async function addcm(){const s=[...document.querySelectorAll('.cs:checked')];await A('POST','/api/admin/combos',{Title:$('ct').value,Items:s.map(x=>x.value),MRP:s.reduce((t,x)=>t+ +x.dataset.p,0),Price:+$('cpr').value});cmb()}
async function dcm(i){await A('POST','/api/admin/combos/'+i+'/delete');cmb()}
async function sup(){const l=await A('GET','/api/admin/chat/rooms');$('mn').innerHTML='<h2>Support Chat</h2>'+((l||[]).map(r=>`<div class=cd><b>${r.Name||'Student'}</b> ${r.Team?'<span class=tag>🔴 Team chahiye</span>':'<span class=tag>🤖 Bot</span>'} <small class=mu>${new Date(r.At*1000).toLocaleString()}</small><br>${r.Last}<br><button onclick="op('${r.Room}')">Open / Reply</button></div>`).join('')||'<div class=cd>Abhi koi chat nahi</div>')}
async function op(r){const m=await A('GET','/api/admin/chat?room='+r);$('mn').innerHTML='<button onclick=sup()>← Back</button><div class=cd>'+m.map(x=>`<p><b>${x.Name}:</b> ${x.Text}</p>`).join('')+'</div><input id=rt placeholder="Reply..."><button onclick="rp(\''+r+'\')">Send</button>'}
async function rp(r){await A('POST','/api/admin/chat',{Room:r,Text:$('rt').value});op(r)}
function bak(){$('mn').innerHTML='<h2>Backup / Import</h2><div class=cd><b>Backup</b><p>Har hafte backup download karo.</p><button onclick=dlb()>Download backup</button></div><div class=cd><b>Restore</b><input type=file id=rf accept=".json"><button onclick=rst()>Restore</button></div><div class=cd><b>Courses import (JSON)</b><small>Kisi bhi website/app ke courses: [{"Title":"..","Category":"English","Duration":"300m","Price":999,"MRP":1999,"Image":"https://..."}]</small><textarea id=ij rows=6></textarea><button onclick=imp()>Import</button></div>'}
async function dlb(){const r=await fetch('/api/admin/backup',{headers:{'X-Admin-Key':K}});const b=await r.blob();const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='janhavi-backup.json';x.click()}
async function rst(){const t=await $('rf').files[0].text();alert(JSON.stringify(await A('POST','/api/admin/restore',JSON.parse(t))))}
async function imp(){const r=await A('POST','/api/admin/courses/import',JSON.parse($('ij').value));alert('Imported: '+r.imported)}
async function ord(){const o=Object.values(await A('GET','/api/admin/orders')||{});$('mn').innerHTML='<h2>Orders</h2><div class=cd><table><tr><th>Date<th>Amount<th>Status</tr>'+o.map(x=>`<tr><td>${new Date(x.At*1000).toLocaleString()}<td>${R(x.Amount)}<td>${x.Paid?'✅ Paid':'⏳ Pending'}</tr>`).join('')+'</table></div>'}
async function stu(){U=await A('GET','/api/admin/students');$('mn').innerHTML='<h2>Customers ('+Object.keys(U).length+') / Newsletter</h2><div class=cd><small>Kisi ko tick nahi kiya to SAB ko jaayega</small><br>'+Object.values(U).map(u=>`<label><input type=checkbox style="width:auto" class=sel value="${u.ID}"> ${u.Name||'-'} | ${u.Phone||''} | ${u.Email||''}</label><br>`).join('')+'</div><div class=cd><select id=ch><option value=whatsapp>WhatsApp</option><option value=email>Email</option></select><input id=sb2 placeholder="Subject (email)"><textarea id=ms rows=4 placeholder="Message"></textarea><button onclick=snd()>Send</button></div>'}
async function snd(){const ids=[...document.querySelectorAll('.sel:checked')].map(x=>x.value);const r=await A('POST','/api/admin/broadcast',{Channel:$('ch').value,Subject:$('sb2').value,Message:$('ms').value,UserIDs:ids});alert('Queued: '+r.queued)}
async function liv(){const l=await (await fetch('/api/live',{headers:{}})).json().catch(()=>[]);$('mn').innerHTML='<h2>Live Classes</h2><div class=cd><input id=lt placeholder="Class title"><input id=la placeholder="Kab? (Today 7:00 PM)"><input id=ll placeholder="Zoom / Meet / YouTube Live link"><button onclick=addl()>Add class</button></div>'+(l||[]).map(x=>`<div class=cd><b>${x.Title}</b> <small>${x.At}</small><br><small>${x.Link}</small><br><button onclick="dl('${x.ID}')">Delete</button></div>`).join('')}
async function addl(){await A('POST','/api/admin/live',{Title:$('lt').value,At:$('la').value,Link:$('ll').value});liv()}
async function dl(i){await A('POST','/api/admin/live/'+i+'/delete');liv()}
async function rev(){const l=await A('GET','/api/admin/reviews');$('mn').innerHTML='<h2>Reviews</h2>'+((l||[]).map(r=>`<div class=cd><b>${r.Name}</b> ⭐${r.Stars}<br>${r.Text}<br>${r.Approved?'✅ Approved':`<button onclick="ap('${r.ID}')">Approve</button>`}</div>`).join('')||'<div class=cd>No reviews</div>')}
async function ap(i){await A('POST','/api/admin/reviews/'+i+'/approve');rev()}
const F=[['rz_key_id','Razorpay Key ID'],['rz_key_secret','Razorpay Key Secret'],['smtp_host','SMTP host'],['smtp_port','SMTP port'],['smtp_user','SMTP email'],['smtp_pass','SMTP app password'],['wa_url','WhatsApp API URL'],['wa_token','WhatsApp API token'],['cert_signer','Certificate signature naam'],['wa_number','Support WhatsApp number (91XXXXXXXXXX)'],['ref_percent','Referral commission % (default 10)'],['target_revenue','Monthly revenue target'],['target_students','Student target']];
function set(){$('mn').innerHTML='<h2>Settings</h2><div class=cd>'+F.map(f=>`<label>${f[1]}<input id=${f[0]} type=password></label>`).join('')+'<label>Certificate template (HTML) — placeholders: {{name}} {{course}} {{roll}} {{date}} {{signer}} {{id}}<textarea id=cert_template rows=8></textarea></label><button onclick=ss()>Save</button><br><small class=mu>Sirf wahi bharo jo badalna hai. Template khali = default design.</small></div>'}
async function ss(){const b={};[...F.map(f=>f[0]),'cert_template'].forEach(k=>{if($(k).value)b[k]=$(k).value});await A('PUT','/api/admin/settings',b);alert('Saved')}

async function com(){const l=await A('GET','/api/admin/groups');C=await A('GET','/api/admin/courses');$('mn').innerHTML='<h2>Community</h2><p class=mu>Sirf admin group banata hai aur students add karta hai.</p><div class=cd><b>Naya group</b><input id=gn placeholder="Group ka naam"><button onclick=addg()>Create</button></div>'+(l||[]).map(g=>`<div class=cd><b>${g.Name}</b> <small class=mu>${(g.Members||[]).length} members</small><hr><b>Students add karo (date + amount ke hisaab se)</b><div class=g><label>Kab se<input type=date id=f_${g.ID}></label><label>Kab tak<input type=date id=t_${g.ID}></label><label>Min amount ₹<input type=number id=a_${g.ID}></label><label>Max amount ₹<input type=number id=b_${g.ID}></label><label>Course<select id=c_${g.ID}><option value="">Koi bhi</option>${C.map(c=>`<option value=${c.ID}>${c.Title}</option>`).join('')}</select></label></div><button onclick="addm('${g.ID}')">Filter wale add karo</button><button onclick="addm('${g.ID}',1)">Sab students add karo</button></div>`).join('')}
async function addg(){await A('POST','/api/admin/groups',{Name:$('gn').value});com()}
async function addm(i,all){const v=x=>$(x+'_'+i).value;const r=await A('POST','/api/admin/groups/'+i+'/add',{All:!!all,FromDate:v('f'),ToDate:v('t'),MinAmount:+v('a'),MaxAmount:+v('b'),CourseID:v('c')});alert(r.added+' naye students add hue (total '+r.members+')');com()}
async function ref(){const l=await A('GET','/api/admin/referrals');$('mn').innerHTML='<h2>Referrals</h2><p class=mu>Referral code = student ka Roll No. Commission % Settings me.</p><div class=cd><table><tr><th>Student<th>Code<th>Referred<th>Earned<th>Paid<th></tr>'+(l||[]).map(x=>`<tr><td>${x.Name}<td>${x.Roll}<td>${x.Referred}<td>${R(x.Earned)}<td>${R(x.Paid)}<td><button onclick="pay('${x.ID}',${x.Earned-x.Paid})">Mark paid ${R(x.Earned-x.Paid)}</button></tr>`).join('')+'</table></div>'}
async function pay(i,x){if(x>0&&confirm('Rs '+x+' pay kar diya?')){await A('POST','/api/admin/referrals/pay',{UserID:i,Amount:x});ref()}}
async function faq(){const l=await A('GET','/api/admin/faqs');$('mn').innerHTML='<h2>Auto-reply Q&A (Bot)</h2><p class=mu>Sawal match na ho ya student "team" likhe to chat team ko chali jaati hai.</p><div class=cd><input id=fk placeholder="Keywords (comma se): price, fees, kitna"><textarea id=fa rows=3 placeholder="Bot ka jawab"></textarea><button onclick=addf()>Add</button></div>'+(l||[]).map((f,i)=>`<div class=cd><b>${f.Keywords}</b><br>${f.Answer}<br><button onclick="delf(${i})">Delete</button></div>`).join('')}
async function addf(){await A('POST','/api/admin/faqs',{Keywords:$('fk').value,Answer:$('fa').value});faq()}
async function delf(i){await A('POST','/api/admin/faqs/'+i+'/delete');faq()}
function cd(t){return '<pre>'+t.replace(/</g,'&lt;')+'</pre>'}
function int(){const U=location.origin;$('mn').innerHTML=`<h2>Website Connect</h2><p class=mu>Aapka server: <b>${U}</b></p><div class=cd><b>Tareeka 1 (sabse aasaan, Laravel/Node/koi bhi site): 2 line paste karo</b>${cd('<div id="jp-courses"></div>\n<script src="'+U+'/embed.js"></scr'+'ipt>')}Courses + combos cards me dikhenge, Buy Now par checkout (login + coupon + Razorpay) khulega.</div>
<div class=cd><b>Tareeka 2: Laravel</b>${cd("// routes/web.php\nRoute::get('/courses', function () {\n  $courses = Http::get('"+U+"/api/courses')->json();\n  return view('courses', compact('courses'));\n});\n\n// resources/views/courses.blade.php\n@foreach($courses as $c)\n  <h3>{{ $c['Title'] }}</h3> ₹{{ $c['Price'] }}\n  <a href=\""+U+"/checkout/{{ $c['ID'] }}\">Buy Now</a>\n@endforeach")}</div>
<div class=cd><b>Tareeka 3: Node / Express</b>${cd("const r = await fetch('"+U+"/api/courses');\nconst courses = await r.json();\n// ab apne template me courses dikhao, Buy link: "+U+"/checkout/<course.ID>")}</div>
<div class=cd><b>Login/Register apni site se</b>${cd("POST "+U+"/api/auth/register  {name,email,phone,password,ref}\nPOST "+U+"/api/auth/login     {email,password}  -> {token,user}\nGET  "+U+"/api/me   (Authorization: Bearer token)")}Website aur app ka ek hi account chalega.</div>
<div class=cd><b>Purane courses import</b><br>Apni site ke courses ka JSON <b>Backup / Import</b> page me paste karo.</div>`}

async function pst(){const l=await A('GET','/api/admin/posts');$('mn').innerHTML='<h2>Community Posts</h2><div class=cd><select id=pk><option value=announcement>Announcement</option><option value=post>Post</option></select><textarea id=pt rows=3 placeholder="Students ko kya batana hai?"></textarea><button onclick=addp()>Publish</button></div>'+(l||[]).slice().reverse().map(p=>`<div class=cd><b>${p.Name}</b> <span class=tag>${p.Role}</span> <span class=tag>${p.Kind}</span><br>${p.Text}<br><small class=mu>${p.Likes?p.Likes.length:0} likes</small> <button onclick="dp('${p.ID}')">Delete</button></div>`).join('')}
async function addp(){await A('POST','/api/admin/posts',{Text:$('pt').value,Kind:$('pk').value});pst()}
async function dp(i){await A('POST','/api/admin/posts/'+i+'/delete');pst()}
</script>
